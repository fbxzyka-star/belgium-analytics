name: AI Research

on:
  schedule:
    - cron: "7 */2 * * *"    # every 2 hours (free tier = 20 calls/day)
  workflow_dispatch:          # adds a "Run workflow" button to test by hand
    inputs:
      search:
        description: "Use Google Search"
        default: "true"

permissions:
  contents: write             # allowed to save research.json in the repo

concurrency:
  group: ai-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Ask Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API }}
          USE_SEARCH: ${{ inputs.search || 'true' }}
        run: python scripts/research.py

      - name: Save research.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research.json
          git diff --cached --quiet || git commit -m "AI research update"
          git pull --rebase
          git push
